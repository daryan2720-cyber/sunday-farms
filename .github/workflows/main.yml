name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - run: npx expo install --fix
      - run: npm test
      - run: npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/SundayFarms-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SundayFarms-apk
          path: dist/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: dist/*.apk
