name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        shell: bash
        run: |
          set +e
          step() {
            echo "::group::$1"; local t="$1"; shift
            "$@" > /tmp/log 2>&1; local rc=$?; cat /tmp/log; echo "::endgroup::"
            if [ $rc -ne 0 ]; then
              msg=$(tail -n 60 /tmp/log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
              echo "::error title=$t failed::$msg"; exit 1
            fi
          }
          echo "ANDROID_HOME=$ANDROID_HOME"
          npm config set legacy-peer-deps true
          step "npm install" npm install --no-audit --no-fund
          step "expo install --fix" npx expo install --fix
          step "tests" npm test
          step "prebuild" npx expo prebuild --platform android --no-install
          cd android
          step "gradle" ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
          cd ..
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/SundayFarms-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SundayFarms-apk
          path: dist/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: dist/*.apk
